name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format Check
        run: make fmt-check
      - name: Test
        run: go test ./...
      - name: Script Tests
        run: make test-scripts
      - name: Help/Docs Drift Check
        run: make check-help-docs
      - name: Release Preflight Smoke
        run: ./scripts/release_preflight.sh v0.0.0
