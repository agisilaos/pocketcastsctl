name: release-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  release-check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Go 1.22 binaries lack the LC_UUID required by macOS 26 runners.
          go-version: '1.26.x'

      # Intentionally no extra dependency install step (brew/apt).
      # release-check scripts must rely on stock runner tooling.
      - name: Run release check
        run: make release-check-ci
